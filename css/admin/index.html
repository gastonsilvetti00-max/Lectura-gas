<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Lectura y opinión</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet">

<style>
:root {
  --marfil:        #F7F2EA;
  --marfil-oscuro: #F0E9DC;
  --acento:        #7A9BB0;
  --acento-oscuro: #5E8299;
  --piedra:        #B8B5A8;
  --marron:        #3B2C20;
  --marron-suave:  #6B5544;
  --rojo:          #C0392B;
  --verde:         #27AE60;
  --serif: 'Fraunces', Georgia, serif;
  --sans:  'DM Sans', sans-serif;
  --radio: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--marfil-oscuro);
  color: var(--marron);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── LOGIN ── */
#pantalla-login {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.login-box {
  background: var(--marfil);
  border: 1px solid rgba(59,44,32,.1);
  border-radius: 20px;
  padding: 48px 40px;
  width: 100%; max-width: 420px;
  box-shadow: 0 16px 48px rgba(59,44,32,.1);
}
.login-box h1 {
  font-family: var(--serif);
  font-size: 32px; font-weight: 300;
  margin-bottom: 8px;
}
.login-box h1 em { font-style: italic; color: var(--acento); }
.login-box p { font-size: 15px; color: var(--marron-suave); margin-bottom: 32px; }

/* ── ADMIN LAYOUT ── */
#pantalla-admin { display: none; min-height: 100vh; }

.admin-header {
  background: var(--marron);
  color: var(--marfil);
  padding: 18px 32px;
  display: flex; justify-content: space-between; align-items: center;
}
.admin-header .logo { font-family: var(--serif); font-size: 20px; font-weight: 300; }
.admin-header .logo em { font-style: italic; color: var(--acento); }
.admin-header .usuario { font-size: 14px; opacity: .7; }

.admin-body {
  max-width: 1100px; margin: 0 auto;
  padding: 40px 24px;
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 32px;
  align-items: start;
}

/* ── FORMULARIO ── */
.form-panel {
  background: var(--marfil);
  border: 1px solid rgba(59,44,32,.09);
  border-radius: 16px;
  padding: 32px;
  position: sticky; top: 24px;
}
.form-panel h2 {
  font-family: var(--serif); font-size: 24px; font-weight: 500;
  margin-bottom: 24px;
}
.form-panel h2 em { font-style: italic; color: var(--acento); }

.form-group { margin-bottom: 18px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 600;
  letter-spacing: .15em; text-transform: uppercase;
  color: var(--marron-suave); margin-bottom: 6px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid rgba(59,44,32,.15);
  border-radius: 8px;
  font-family: var(--sans); font-size: 15px;
  color: var(--marron);
  background: var(--marfil);
  transition: border-color .2s;
  outline: none;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--acento);
  box-shadow: 0 0 0 3px rgba(122,155,176,.15);
}
.form-group textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* Rating estrellas */
.rating-input { display: flex; gap: 6px; margin-top: 4px; }
.star-btn {
  background: none; border: none; cursor: pointer;
  font-size: 26px; color: var(--piedra);
  transition: color .15s, transform .15s;
  padding: 0; line-height: 1;
}
.star-btn.activa { color: var(--acento); }
.star-btn:hover  { color: var(--acento); transform: scale(1.15); }

/* Checkboxes */
.checks { display: flex; gap: 20px; margin-top: 4px; }
.check-label {
  display: flex; align-items: center; gap: 7px;
  font-size: 15px; cursor: pointer; font-weight: 400;
}
.check-label input[type=checkbox] {
  width: 18px; height: 18px;
  accent-color: var(--acento);
  cursor: pointer;
}

/* Preview de tapa */
.tapa-preview {
  width: 80px; aspect-ratio: 2/3;
  border-radius: 8px; overflow: hidden;
  background: var(--marfil-oscuro);
  border: 1.5px dashed var(--piedra);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--marron-suave);
  text-align: center; margin-top: 8px;
}
.tapa-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

.btn-submit {
  width: 100%; padding: 14px;
  background: var(--marron); color: var(--marfil);
  border: none; border-radius: 999px;
  font-family: var(--sans); font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .2s; margin-top: 8px;
}
.btn-submit:hover { background: var(--acento); }
.btn-submit:disabled { opacity: .6; cursor: not-allowed; }

.btn-cancelar {
  width: 100%; padding: 11px;
  background: transparent; color: var(--marron-suave);
  border: 1.5px solid rgba(59,44,32,.15);
  border-radius: 999px;
  font-family: var(--sans); font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all .2s; margin-top: 8px;
}
.btn-cancelar:hover { border-color: var(--rojo); color: var(--rojo); }

.form-msg {
  padding: 12px 16px; border-radius: 8px;
  font-size: 14px; margin-top: 14px; display: none;
}
.form-msg.ok    { background: #D5F5E3; color: #1E8449; }
.form-msg.error { background: #FADBD8; color: var(--rojo); }

/* ── LISTA DE LIBROS ── */
.lista-panel h2 {
  font-family: var(--serif); font-size: 24px; font-weight: 500;
  margin-bottom: 20px;
}
.lista-panel h2 em { font-style: italic; color: var(--acento); }

.libro-item {
  background: var(--marfil);
  border: 1px solid rgba(59,44,32,.08);
  border-radius: 12px;
  padding: 16px 18px;
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 12px;
  transition: box-shadow .2s;
}
.libro-item:hover { box-shadow: 0 4px 16px rgba(59,44,32,.08); }
.libro-item-tapa {
  width: 44px; aspect-ratio: 2/3; flex-shrink: 0;
  border-radius: 6px; overflow: hidden;
  background: var(--piedra);
}
.libro-item-tapa img { width: 100%; height: 100%; object-fit: cover; }
.libro-item-tapa-placeholder {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, var(--piedra), var(--acento));
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--marfil); text-align: center; padding: 4px;
}
.libro-item-info { flex-grow: 1; min-width: 0; }
.libro-item-titulo {
  font-family: var(--serif); font-size: 16px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.libro-item-meta { font-size: 12px; color: var(--marron-suave); margin-top: 2px; }
.libro-item-badges { display: flex; gap: 6px; margin-top: 6px; }
.badge {
  font-size: 10px; padding: 2px 8px; border-radius: 999px;
  font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
}
.badge-cat    { background: rgba(122,155,176,.15); color: var(--acento-oscuro); }
.badge-leido  { background: #D5F5E3; color: #1E8449; }
.badge-dest   { background: rgba(59,44,32,.08); color: var(--marron); }

.libro-item-acciones { display: flex; gap: 8px; flex-shrink: 0; }
.btn-accion {
  padding: 7px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .2s; border: 1.5px solid;
}
.btn-editar  { border-color: var(--acento); color: var(--acento); background: transparent; }
.btn-editar:hover  { background: var(--acento); color: var(--marfil); }
.btn-borrar  { border-color: rgba(59,44,32,.2); color: var(--marron-suave); background: transparent; }
.btn-borrar:hover  { border-color: var(--rojo); color: var(--rojo); }

.lista-vacia {
  text-align: center; padding: 48px;
  font-family: var(--serif); font-style: italic;
  color: var(--marron-suave); font-size: 18px;
}

/* ── AUTH FORM ── */
.auth-group { margin-bottom: 16px; }
.auth-group label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--marron-suave); margin-bottom: 6px; }
.auth-group input { width: 100%; padding: 12px 14px; border: 1.5px solid rgba(59,44,32,.15); border-radius: 8px; font-family: var(--sans); font-size: 15px; color: var(--marron); background: var(--marfil); outline: none; transition: border-color .2s; }
.auth-group input:focus { border-color: var(--acento); box-shadow: 0 0 0 3px rgba(122,155,176,.15); }
.btn-login { width: 100%; padding: 14px; background: var(--marron); color: var(--marfil); border: none; border-radius: 999px; font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 8px; }
.btn-login:hover { background: var(--acento); }
.auth-error { color: var(--rojo); font-size: 14px; margin-top: 12px; display: none; }

/* Btn logout */
.btn-logout { background: rgba(247,242,234,.12); color: var(--marfil); border: 1px solid rgba(247,242,234,.25); padding: 7px 16px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: background .2s; }
.btn-logout:hover { background: rgba(247,242,234,.22); }

@media (max-width: 860px) {
  .admin-body { grid-template-columns: 1fr; }
  .form-panel { position: static; }
}
</style>
</head>
<body>

<!-- PANTALLA LOGIN -->
<div id="pantalla-login">
  <div class="login-box">
    <h1>Lectura <em>y opinión</em></h1>
    <p>Panel de administración. Solo para Gastón.</p>
    <div class="auth-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="gastonsilvetti00@gmail.com" autocomplete="email">
    </div>
    <div class="auth-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login">Entrar</button>
    <p class="auth-error" id="login-error"></p>
  </div>
</div>

<!-- PANTALLA ADMIN -->
<div id="pantalla-admin">
  <div class="admin-header">
    <span class="logo">Lectura <em>y opinión</em> · Admin</span>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="usuario" id="usuario-email"></span>
      <button class="btn-logout" id="btn-logout">Salir</button>
    </div>
  </div>

  <div class="admin-body">

    <!-- FORMULARIO -->
    <div class="form-panel">
      <h2 id="form-titulo">Agregar <em>libro</em></h2>
      <input type="hidden" id="libro-id">

      <div class="form-group">
        <label>Título *</label>
        <input type="text" id="f-titulo" placeholder="Hábitos atómicos">
      </div>
      <div class="form-group">
        <label>Autor *</label>
        <input type="text" id="f-autor" placeholder="James Clear">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Categoría *</label>
          <select id="f-categoria">
            <option value="">— elegir —</option>
            <option value="negocios">Negocios</option>
            <option value="productividad">Productividad</option>
            <option value="marketing">Marketing</option>
            <option value="ventas">Ventas</option>
            <option value="autobiografia">Autobiografía</option>
            <option value="gestion-del-tiempo">Gestión del tiempo</option>
          </select>
        </div>
        <div class="form-group">
          <label>Rating</label>
          <div class="rating-input" id="rating-input">
            <button class="star-btn" data-val="1">★</button>
            <button class="star-btn" data-val="2">★</button>
            <button class="star-btn" data-val="3">★</button>
            <button class="star-btn" data-val="4">★</button>
            <button class="star-btn" data-val="5">★</button>
          </div>
          <input type="hidden" id="f-rating" value="">
        </div>
      </div>

      <div class="form-group">
        <label>URL de la tapa</label>
        <input type="url" id="f-tapa" placeholder="https://…jpg">
        <div class="tapa-preview" id="tapa-preview">
          <span>Sin tapa</span>
        </div>
      </div>

      <div class="form-group">
        <label>Link Mercado Libre</label>
        <input type="url" id="f-link" placeholder="https://articulo.mercadolibre.com.ar/…">
      </div>

      <div class="form-group">
        <label>A quién se lo recomendarías</label>
        <input type="text" id="f-para" placeholder="Alguien que quiere cambiar hábitos sin fuerza de voluntad…">
      </div>

      <div class="form-group">
        <label>Reseña personal</label>
        <textarea id="f-resena" placeholder="Tu opinión honesta, como se la contarías a un amigo…"></textarea>
      </div>

      <div class="form-group">
        <label>Estado y opciones</label>
        <div class="checks">
          <label class="check-label">
            <input type="checkbox" id="f-leido" checked>
            Leído
          </label>
          <label class="check-label">
            <input type="checkbox" id="f-destacado">
            Destacado (aparece en la landing)
          </label>
        </div>
      </div>

      <button class="btn-submit" id="btn-guardar">Publicar libro</button>
      <button class="btn-cancelar" id="btn-cancelar" style="display:none">Cancelar edición</button>
      <div class="form-msg" id="form-msg"></div>
    </div>

    <!-- LISTA -->
    <div class="lista-panel">
      <h2>Todos los <em>libros</em></h2>
      <div id="lista-libros">
        <div class="lista-vacia">Cargando…</div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const db = createClient(
  'https://dnffifdouniqirlljrse.supabase.co',
  'sb_publishable_TL7Ypxd2AoVxT9R6lUZSbQ_PInx0wpI'
);

const CATEGORIAS = {
  'negocios':'Negocios','productividad':'Productividad','marketing':'Marketing',
  'ventas':'Ventas','autobiografia':'Autobiografía','gestion-del-tiempo':'Gestión del tiempo'
};

// ── AUTH ──
async function checkSession() {
  const { data: { session } } = await db.auth.getSession();
  if (session) mostrarAdmin(session.user);
}

document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const err   = document.getElementById('login-error');
  err.style.display = 'none';

  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if (error) {
    err.textContent = 'Email o contraseña incorrectos.';
    err.style.display = 'block';
  } else {
    mostrarAdmin(data.user);
  }
});

document.getElementById('login-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-login').click();
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await db.auth.signOut();
  document.getElementById('pantalla-admin').style.display = 'none';
  document.getElementById('pantalla-login').style.display = 'flex';
});

function mostrarAdmin(user) {
  document.getElementById('pantalla-login').style.display = 'none';
  document.getElementById('pantalla-admin').style.display = 'block';
  document.getElementById('usuario-email').textContent = user.email;
  cargarLibros();
}

// ── RATING ESTRELLAS ──
let ratingActual = 0;
document.querySelectorAll('.star-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const val = parseInt(btn.dataset.val);
    // Si ya tiene ese valor, lo resetea
    ratingActual = ratingActual === val ? 0 : val;
    document.getElementById('f-rating').value = ratingActual || '';
    actualizarEstrellas();
  });
  btn.addEventListener('mouseenter', () => resaltarEstrellas(parseInt(btn.dataset.val)));
  btn.addEventListener('mouseleave', actualizarEstrellas);
});
function resaltarEstrellas(n) {
  document.querySelectorAll('.star-btn').forEach(b => {
    b.classList.toggle('activa', parseInt(b.dataset.val) <= n);
  });
}
function actualizarEstrellas() { resaltarEstrellas(ratingActual); }

// ── PREVIEW TAPA ──
document.getElementById('f-tapa').addEventListener('input', function() {
  const prev = document.getElementById('tapa-preview');
  const url = this.value.trim();
  if (url) {
    prev.innerHTML = `<img src="${url}" onerror="this.parentElement.innerHTML='<span>URL inválida</span>'">`;
  } else {
    prev.innerHTML = '<span>Sin tapa</span>';
  }
});

// ── FORMULARIO ──
function limpiarForm() {
  document.getElementById('libro-id').value = '';
  document.getElementById('f-titulo').value = '';
  document.getElementById('f-autor').value = '';
  document.getElementById('f-categoria').value = '';
  document.getElementById('f-rating').value = '';
  document.getElementById('f-tapa').value = '';
  document.getElementById('f-link').value = '';
  document.getElementById('f-para').value = '';
  document.getElementById('f-resena').value = '';
  document.getElementById('f-leido').checked = true;
  document.getElementById('f-destacado').checked = false;
  document.getElementById('tapa-preview').innerHTML = '<span>Sin tapa</span>';
  ratingActual = 0; actualizarEstrellas();
  document.getElementById('form-titulo').innerHTML = 'Agregar <em>libro</em>';
  document.getElementById('btn-guardar').textContent = 'Publicar libro';
  document.getElementById('btn-cancelar').style.display = 'none';
  ocultarMsg();
}

document.getElementById('btn-cancelar').addEventListener('click', limpiarForm);

document.getElementById('btn-guardar').addEventListener('click', async () => {
  const titulo    = document.getElementById('f-titulo').value.trim();
  const autor     = document.getElementById('f-autor').value.trim();
  const categoria = document.getElementById('f-categoria').value;
  const msg       = document.getElementById('form-msg');

  if (!titulo || !autor || !categoria) {
    mostrarMsg('Completá título, autor y categoría antes de guardar.', 'error');
    return;
  }

  const payload = {
    titulo,
    autor,
    categoria,
    rating:           parseInt(document.getElementById('f-rating').value) || null,
    tapa_url:         document.getElementById('f-tapa').value.trim() || null,
    link_ml:          document.getElementById('f-link').value.trim() || null,
    recomendado_para: document.getElementById('f-para').value.trim() || null,
    resena:           document.getElementById('f-resena').value.trim() || null,
    leido:            document.getElementById('f-leido').checked,
    destacado:        document.getElementById('f-destacado').checked,
    slug:             slugify(titulo),
  };

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  const id = document.getElementById('libro-id').value;
  let error;

  if (id) {
    ({ error } = await db.from('libros').update(payload).eq('id', id));
  } else {
    ({ error } = await db.from('libros').insert(payload));
  }

  btn.disabled = false;
  btn.textContent = id ? 'Guardar cambios' : 'Publicar libro';

  if (error) {
    mostrarMsg('Error al guardar: ' + error.message, 'error');
  } else {
    mostrarMsg(id ? 'Libro actualizado ✓' : 'Libro publicado ✓', 'ok');
    limpiarForm();
    cargarLibros();
  }
});

function mostrarMsg(texto, tipo) {
  const el = document.getElementById('form-msg');
  el.textContent = texto;
  el.className = `form-msg ${tipo}`;
  el.style.display = 'block';
}
function ocultarMsg() {
  const el = document.getElementById('form-msg');
  el.style.display = 'none';
}

function slugify(s) {
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-|-$/g,'');
}

// ── CARGAR LISTA ──
async function cargarLibros() {
  const { data } = await db.from('libros').select('*').order('created_at', { ascending: false });
  const lista = document.getElementById('lista-libros');

  if (!data || data.length === 0) {
    lista.innerHTML = '<div class="lista-vacia">Todavía no cargaste ningún libro.</div>';
    return;
  }

  lista.innerHTML = data.map(l => `
    <div class="libro-item" data-id="${l.id}">
      <div class="libro-item-tapa">
        ${l.tapa_url
          ? `<img src="${l.tapa_url}" onerror="this.parentElement.innerHTML='<div class=libro-item-tapa-placeholder></div>'">`
          : `<div class="libro-item-tapa-placeholder"></div>`
        }
      </div>
      <div class="libro-item-info">
        <div class="libro-item-titulo">${esc(l.titulo)}</div>
        <div class="libro-item-meta">${esc(l.autor)} · ${l.rating ? '★'.repeat(l.rating) : 'sin rating'}</div>
        <div class="libro-item-badges">
          ${l.categoria ? `<span class="badge badge-cat">${CATEGORIAS[l.categoria]||l.categoria}</span>` : ''}
          ${l.leido ? '<span class="badge badge-leido">Leído</span>' : '<span class="badge" style="background:rgba(59,44,32,.07)">Por leer</span>'}
          ${l.destacado ? '<span class="badge badge-dest">⭐ Destacado</span>' : ''}
        </div>
      </div>
      <div class="libro-item-acciones">
        <button class="btn-accion btn-editar" onclick="editarLibro('${l.id}')">Editar</button>
        <button class="btn-accion btn-borrar" onclick="borrarLibro('${l.id}', '${esc(l.titulo)}')">Borrar</button>
      </div>
    </div>
  `).join('');
}

// ── EDITAR ──
async function editarLibro(id) {
  const { data } = await db.from('libros').select('*').eq('id', id).single();
  if (!data) return;

  document.getElementById('libro-id').value         = data.id;
  document.getElementById('f-titulo').value         = data.titulo || '';
  document.getElementById('f-autor').value          = data.autor || '';
  document.getElementById('f-categoria').value      = data.categoria || '';
  document.getElementById('f-tapa').value           = data.tapa_url || '';
  document.getElementById('f-link').value           = data.link_ml || '';
  document.getElementById('f-para').value           = data.recomendado_para || '';
  document.getElementById('f-resena').value         = data.resena || '';
  document.getElementById('f-leido').checked        = !!data.leido;
  document.getElementById('f-destacado').checked    = !!data.destacado;

  ratingActual = data.rating || 0;
  document.getElementById('f-rating').value = ratingActual || '';
  actualizarEstrellas();

  // Preview tapa
  const prev = document.getElementById('tapa-preview');
  prev.innerHTML = data.tapa_url
    ? `<img src="${data.tapa_url}">`
    : '<span>Sin tapa</span>';

  document.getElementById('form-titulo').innerHTML = 'Editar <em>libro</em>';
  document.getElementById('btn-guardar').textContent = 'Guardar cambios';
  document.getElementById('btn-cancelar').style.display = 'block';
  ocultarMsg();

  // Scroll al form en mobile
  document.querySelector('.form-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── BORRAR ──
async function borrarLibro(id, titulo) {
  if (!confirm(`¿Borrar "${titulo}"? Esta acción no se puede deshacer.`)) return;
  const { error } = await db.from('libros').delete().eq('id', id);
  if (error) alert('Error al borrar: ' + error.message);
  else cargarLibros();
}

function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Exponer funciones para onclick
window.editarLibro = editarLibro;
window.borrarLibro = borrarLibro;

checkSession();
</script>
